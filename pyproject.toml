[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moonlight-investigator"
version = "0.1.0"
description = "Evidence-first, local-first Windows process and disk investigator"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "psutil==7.2.2",
    "pydantic==2.14.1",
    "httpx==0.28.1",
    "send2trash==2.1.0",
    "PySide6==6.12.0",
]

[project.optional-dependencies]
dev = [
    "types-psutil==7.2.2.20260906",
    "pytest==9.1.1",
    "hypothesis==6.170.12",
    "ruff==0.17.2",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
]

[project.scripts]
moonlight = "moonlight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"moonlight.rules" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "benchmarks"]
strict = true
