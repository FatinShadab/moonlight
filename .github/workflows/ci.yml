name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest -q
      - name: Collect current Windows process
        run: |
          $bundle = moonlight collect --pid $PID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundle | python -m moonlight.eval.collection_smoke --pid $PID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
