name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest -q
      - name: Collect current Windows process
        run: |
          $bundle = moonlight collect --pid $PID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundle
          $bundle | python -c "import sys; from moonlight.core.evidence import EvidenceBundle, EvidenceKind; b = EvidenceBundle.model_validate_json(sys.stdin.read()); assert len(b.items) == 9; assert all(i.availability == 'observed' for i in b.items if i.kind in (EvidenceKind.SHA256, EvidenceKind.SIGNATURE_STATUS))"
